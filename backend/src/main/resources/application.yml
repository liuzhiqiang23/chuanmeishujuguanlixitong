server:
  port: 8000
  undertow:
    io-threads: 16
    worker-threads: 40
    buffer-size: 1024
    direct-buffers: true
  compression:
    enabled: true
    min-response-size: 1

#logging logback
logging:
  config: classpath:logback-spring.xml
  file:
    name: exam

#mybatis
#mybatis:
#  mapper-locations: classpath:/mapper/*.xml
#  configuration:
 #   log-prefix: repository.
mybatis-plus:
  mapper-locations: classpath:mapper/**/*Mapper.xml
  type-aliases-package: com.alvis.media.domain.**
  configuration:
    cache-enabled: false
    map-underscore-to-camel-case: true
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-underline: true
      column-like: true


system:
  security-ignore-urls:
    - /api/wx/**
    - /api/admin/upload/configAndUpload
    - /api/admin/upload/auth
    - /api/student/user/register
    - /api/admin/video/**
  pwdKey:
    # 登录密码用这对 RSA 密钥加解密，必须用环境变量注入，不要提交进 git。
    # 生成：openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out priv.pem
    #       openssl rsa -in priv.pem -pubout
    # 环境变量：PWD_KEY_PUBLIC_KEY / PWD_KEY_PRIVATE_KEY
    publicKey: ${PWD_KEY_PUBLIC_KEY:}
    privateKey: ${PWD_KEY_PRIVATE_KEY:}
  wx:
    # 必须用环境变量注入，不要提交进 git：WX_APPID / WX_SECRET
    # 配好后登录走微信官方 code2session（openid 才稳定）；留空则退回演示模式。
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
    # 管理员白名单（微信 openid，逗号分隔）。这几个号登录后自动是管理员，
    # 前端据此显示删片按钮，后端也会再校验一次 role。环境变量：WX_ADMIN_OPEN_IDS
    admin-open-ids: ${WX_ADMIN_OPEN_IDS:}
    token-to-live: 12h   #token 过期时间
    security-ignore-urls:
      - /api/wx/student/auth/bind
      - /api/wx/student/auth/checkBind
      - /api/wx/student/user/register
      # 小程序商城（会员/券/订单）：演示版靠请求体里的 userId 认人，所以这几组不进 token 拦截。
      # 正式接入微信登录后要收紧——只放行 /api/wx/login，其余接口改成从 token 解析用户。
      - /api/wx/login
      - /api/wx/member/**
      - /api/wx/coupon/**
      - /api/wx/order/**
      # 分类导航和搜索是公开数据；admin/video/delete 在 controller 里自己校验 role == 3
      - /api/wx/category/**
      - /api/wx/search/**
      - /api/wx/admin/**



#mybatis page helper
pagehelper:
  autoDialect: true
  closeConn: true
  reasonable: true


#mybatis datasource default HikariPool
spring:
  servlet:
    multipart:
      # 文件最大限制
      max-file-size: 1024MB
      # 请求最大限制
      max-request-size: 1024MB
      enabled: true
      # 设置文件缓存的临界点,超过则先保存到临时目录,默认为0,所有文件都会进行缓存
      file-size-threshold: 0
  session:
    store-type: redis
  datasource:
    hikari:
      idle-timeout: 600000  #10 min
      max-lifetime: 1800000 #30 min
  data:
    redis:
      timeout: 10000 #超时时间
      database: 0 #0-15 16个库 默认0
      lettuce:
        pool:
          max-active: 8 #最大连接数
          max-wait: -1 #默认-1 最大连接阻塞等待时间
          max-idle: 8 #最大空闲连接 默认8
          min-idle: 0 #最小空闲连接
  cache:
    type: redis
    redis:
      time-to-live: 12h   #12 hour


  #runningtime environment
  profiles:
    active:  dev
